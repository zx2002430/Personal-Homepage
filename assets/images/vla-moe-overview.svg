<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">Shared VLA policy with action-tail residuals</title>
  <desc id="desc">Study schematic. A shared vision-language representation and action backbone produce a shared action prediction. A small task-group residual is added at the final action projection.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#89a798"/></marker></defs>
  <rect width="640" height="440" fill="#eef1e9"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="320" y="48" font-size="15" letter-spacing="2" fill="#486357">SHARE THE POLICY · SPECIALIZE THE TAIL</text>
    <rect x="58" y="76" width="524" height="54" rx="10" fill="#fffefa" stroke="#c6d4c6"/>
    <text x="320" y="110" font-size="19" fill="#335143">Images + instruction + robot state</text>
    <path d="M320 133V158" stroke="#89a798" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="94" y="169" width="452" height="66" rx="11" fill="#146b55"/>
    <text x="320" y="199" font-size="21" font-weight="600" fill="#fff">Shared VLA policy</text><text x="320" y="220" font-size="12" fill="#d8eee1">Vision-language representation + action backbone</text>
    <path d="M230 238V269M410 238V269" stroke="#89a798" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="51" y="281" width="270" height="57" rx="9" fill="#dce8df"/>
    <rect x="347" y="281" width="242" height="57" rx="9" fill="#ece3cd"/>
    <text x="186" y="306" font-size="19" font-weight="600" fill="#275b42">Shared action</text><text x="186" y="326" font-size="12" fill="#5b6c5f">Common policy prediction</text>
    <text x="468" y="306" font-size="18" font-weight="600" fill="#7a5e24">Task-group residual</text><text x="468" y="326" font-size="12" fill="#74684f">Small action-tail capacity</text>
    <path d="M186 340V365H290M468 340V365H350" stroke="#89a798" stroke-width="2" fill="none"/>
    <circle cx="320" cy="365" r="20" fill="#fffefa" stroke="#89a798"/><text x="320" y="373" font-size="26" fill="#275b42">+</text>
    <text x="320" y="413" font-size="15" fill="#486357">Final action · Multi-task LIBERO evaluation</text>
  </g>
</svg>
