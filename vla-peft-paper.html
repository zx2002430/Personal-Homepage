<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VLA 参数高效微调论文 PDF | 赵汛</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="paper-reader.css?v=20261002-aamas-protected">
</head>
<body data-paper="vla-peft">
  <main class="reader">
    <header class="reader-heading">
      <div>
        <h1>视觉-语言-动作模型参数高效微调的实证研究</h1>
        <p class="subtitle">Empirical Investigation of Parameter-Efficient Fine-Tuning in Vision-Language-Action Models</p>
      </div>
      <nav class="reader-actions" aria-label="论文操作">
        <a href="vla-peft.html">返回研究介绍</a>
        <a id="download-paper" class="primary" hidden>下载 PDF</a>
      </nav>
    </header>
    <section id="password-gate" class="password-gate" aria-labelledby="password-title">
      <h2 id="password-title">输入密码阅读论文</h2>
      <p>论文目前为 AAMAS 在投状态。输入访问密码后，可在线阅读或下载 PDF。</p>
      <form id="password-form">
        <label for="paper-password">访问密码</label>
        <div class="password-row">
          <input id="paper-password" type="password" autocomplete="current-password" maxlength="128" required autofocus>
          <button id="unlock-paper" class="primary" type="submit">解锁论文</button>
        </div>
        <p id="password-message" class="password-message" role="status" aria-live="polite"></p>
      </form>
      <noscript>请启用 JavaScript，以解锁并阅读论文。</noscript>
    </section>
    <div id="reader-toolbar" class="toolbar" aria-label="论文阅读工具" hidden>
      <div class="page-controls">
        <button id="previous-page" type="button" disabled>上一页</button>
        <label for="page-number">页码</label>
        <input id="page-number" type="number" min="1" value="1" disabled>
        <span id="page-total" class="page-total" aria-live="polite">/ --</span>
        <button id="go-to-page" type="button" disabled>跳转</button>
        <button id="next-page" type="button" disabled>下一页</button>
      </div>
      <select id="page-zoom" aria-label="页面缩放" disabled>
        <option value="fit">适合宽度</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
    </div>
    <p id="reader-status" class="reader-status" role="status" hidden>正在加载论文...</p>
    <section id="paper-surface" class="paper-surface" aria-label="论文页面" aria-busy="false" hidden>
      <div class="canvas-wrapper">
        <canvas id="paper-canvas" role="img" aria-label="VLA 参数高效微调论文页面" hidden></canvas>
      </div>
    </section>
  </main>
  <script type="module" src="paper-reader.mjs?v=20261002-aamas-protected"></script>
</body>
</html>
